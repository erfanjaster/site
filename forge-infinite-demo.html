<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<title>Forge Infinite — single-file demo</title>
<meta name="description" content="Forge Infinite: a free idle forge game. Self-contained single-file demo build.">
<meta name="theme-color" content="#14120F">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex,nofollow">
<style>
/* =====================================================================
   FORGE INFINITE — style.css  ·  v2 "AAA Ember" design system
   Dark-first, warm-neutral, molten-ember accent. Mobile-first.
   Zero hardcoded colors in components — tokens only.
   Layered glass surfaces · cinematic glow · spring motion · WCAG AA.
   ===================================================================== */

/* ---------- tokens ---------- */
:root {
  color-scheme: dark;
  --bg-void:#080605; --bg-base:#12100D;
  --surface-1:#1B1815; --surface-2:#262019; --surface-3:#342B21;
  --line:#3B3229; --line-strong:#55483A;
  --fg:#F7F1E5; --fg-muted:#C2B6A4; --fg-dim:#93876F; --fg-inverse:#1D1104;
  --ember:#FF7A18; --ember-hot:#FFB020; --ember-deep:#C2410C; --steel:#7DD3FC;
  --gold:#FFC53D; --gem:#2DD4BF; --token:#E879F9;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --info:#7DD3FC;
  --r-common:#A8A29E; --r-uncommon:#4ADE80; --r-rare:#60A5FA;
  --r-epic:#C084FC; --r-legendary:#FBBF24; --r-limited:#FB7185;
  --grad-ember:linear-gradient(135deg,#FFCE54,#FFB020 30%,#FF7A18 58%,#C2410C);
  --grad-gold:linear-gradient(135deg,#FFE9A8,#FFC53D 48%,#D97706);
  --grad-panel:linear-gradient(165deg,color-mix(in srgb,var(--surface-2) 62%,transparent),color-mix(in srgb,var(--surface-1) 88%,transparent));
  --glass:color-mix(in srgb,var(--surface-1) 78%,transparent);
  --glow-ember:0 0 22px color-mix(in srgb,var(--ember) 34%,transparent);
  --glow-gold:0 0 22px color-mix(in srgb,var(--gold) 34%,transparent);
  --hi:inset 0 1px 0 rgba(255,244,220,.055);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --nav-h:62px; --hud-h:60px;
  --shadow-1:0 1px 2px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.28);
  --shadow-2:0 10px 34px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --shadow-3:0 22px 60px rgba(0,0,0,.65),0 4px 16px rgba(0,0,0,.5);
  --ease-spring:cubic-bezier(.2,.9,.26,1.18);
  --ease-out:cubic-bezier(.16,.8,.26,1);
  --tap:48px;
  --font:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Space Grotesk","Inter","Segoe UI",system-ui,sans-serif;
}
[data-theme="midnight"],[data-theme="verdant"],[data-theme="bone"] { color-scheme: light dark; }
[data-theme="midnight"]{
  --bg-void:#05070D; --bg-base:#0B0F18; --surface-1:#141B28; --surface-2:#1C2638; --surface-3:#273449;
  --line:#2B3A52; --line-strong:#40536F; --fg:#E8F0FC; --fg-muted:#A9BBD3; --fg-dim:#7A8CA5;
  --ember:#60A5FA; --ember-hot:#93C5FD; --ember-deep:#1D4ED8;
  --grad-ember:linear-gradient(135deg,#BFDBFE,#93C5FD 30%,#60A5FA 58%,#1D4ED8);
  --hi:inset 0 1px 0 rgba(220,236,255,.06);
}
[data-theme="verdant"]{
  --bg-void:#060A07; --bg-base:#0C130E; --surface-1:#15201A; --surface-2:#1D2C23; --surface-3:#283A2F;
  --line:#2C3F34; --line-strong:#40604C; --fg:#EAF5EC; --fg-muted:#ABC2B1; --fg-dim:#7E9686;
  --ember:#4ADE80; --ember-hot:#86EFAC; --ember-deep:#15803D;
  --grad-ember:linear-gradient(135deg,#BBF7D0,#86EFAC 30%,#4ADE80 58%,#15803D);
  --hi:inset 0 1px 0 rgba(224,255,233,.06);
}
[data-theme="bone"]{
  --bg-void:#E9E1D1; --bg-base:#F7F2E8; --surface-1:#FFFFFF; --surface-2:#FBF7EF; --surface-3:#EFE7D7;
  --line:#DCD2BD; --line-strong:#BFAF93; --fg:#241C12; --fg-muted:#5A4E3E; --fg-dim:#7D7161;
  --fg-inverse:#FFF7ED; --ember:#C2410C; --ember-hot:#EA580C; --ember-deep:#7C2D12;
  --grad-ember:linear-gradient(135deg,#FB923C,#EA580C 45%,#C2410C 70%,#7C2D12);
  --grad-panel:linear-gradient(165deg,#FFFFFF,#FAF4E8);
  --hi:inset 0 1px 0 rgba(255,255,255,.8);
  --shadow-1:0 1px 2px rgba(60,40,10,.14),0 4px 14px rgba(60,40,10,.08);
  --shadow-2:0 10px 30px rgba(60,40,10,.18);
  --shadow-3:0 22px 54px rgba(60,40,10,.22);
}

/* ---------- reset ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg-void); color:var(--fg);
  font-family:var(--font); font-size:15px; line-height:1.55;
  overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased;
}
/* cinematic ambient: two drifting ember nebulae behind everything */
body::before{
  content:""; position:fixed; inset:-12%; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 46% 34% at 18% -4%, color-mix(in srgb,var(--ember) 15%,transparent), transparent 68%),
    radial-gradient(ellipse 40% 30% at 88% 108%, color-mix(in srgb,var(--ember-deep) 13%,transparent), transparent 70%),
    radial-gradient(ellipse 30% 22% at 78% 12%, color-mix(in srgb,var(--gold) 6%,transparent), transparent 70%);
  animation:ambient 26s ease-in-out infinite alternate;
}
@keyframes ambient{from{transform:translate3d(-1.6%,-1%,0) scale(1)}to{transform:translate3d(1.6%,1.4%,0) scale(1.05)}}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:.4em 0}
a{color:var(--ember-hot)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
::selection{background:color-mix(in srgb,var(--ember) 55%,transparent);color:var(--fg)}
.small{font-size:12.5px;color:var(--fg-muted)}
.dim{color:var(--fg-dim)}
.mt{margin-top:26px}
.empty{padding:26px 16px;text-align:center;color:var(--fg-dim)}

/* ---------- app frame ---------- */
#app{
  position:relative; display:flex; flex-direction:column; z-index:1;
  height:100dvh; min-height:100vh; max-width:640px; margin:0 auto;
  background:
    linear-gradient(180deg,color-mix(in srgb,var(--bg-base) 88%,transparent),var(--bg-base) 240px);
  will-change:transform;
}
@media (min-width:900px){
  #app{max-width:1020px;height:100dvh;border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:0 0 90px rgba(0,0,0,.55)}
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:61;overflow:hidden}
#flash{position:fixed;inset:0;pointer-events:none;z-index:59;opacity:0;background:transparent}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 32%,color-mix(in srgb,var(--ember) 14%,transparent),transparent 55%),var(--bg-void);
  transition:opacity .45s var(--ease-out)}
#boot.gone{opacity:0;pointer-events:none}
#boot .logo{width:84px;height:84px;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 0 26px color-mix(in srgb,var(--ember) 55%,transparent))}
#boot p{margin-top:16px;color:var(--fg-muted);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;animation:bootPulse 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes bootPulse{0%,100%{opacity:.55}50%{opacity:1}}

/* ---------- HUD ---------- */
.hud{
  flex:0 0 auto; display:grid; grid-template-columns:auto 1fr auto auto; gap:8px; align-items:center;
  padding:calc(env(safe-area-inset-top) + 9px) 12px 9px;
  background:linear-gradient(180deg,var(--glass),color-mix(in srgb,var(--surface-1) 55%,transparent));
  backdrop-filter:blur(14px) saturate(1.25); -webkit-backdrop-filter:blur(14px) saturate(1.25);
  border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent);
  box-shadow:0 8px 24px rgba(0,0,0,.28),var(--hi);
  position:relative; z-index:20;
}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ember) 55%,transparent),transparent);opacity:.5}
.hud-logo{width:36px;height:36px;background:none;border:0;padding:0;cursor:pointer;border-radius:50%;
  transition:transform .2s var(--ease-spring)}
.hud-logo:hover{transform:scale(1.07) rotate(-3deg)}
.hud-logo .logo{width:36px;height:36px;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--ember) 45%,transparent))}
.hud-res{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;min-width:0}
.res{
  display:flex;align-items:center;gap:4px;min-width:0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface-3) 55%,transparent),color-mix(in srgb,var(--surface-2) 72%,transparent));
  border:1px solid color-mix(in srgb,var(--line-strong) 55%,transparent);border-radius:999px;padding:3px 10px 3px 7px;
  box-shadow:var(--hi),0 2px 8px rgba(0,0,0,.3);
}
.res-ic{font-size:13px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.res-v{font-family:var(--font-display);font-weight:700;font-size:13.5px;white-space:nowrap}
.res-gold .res-v{color:var(--gold);text-shadow:0 0 12px color-mix(in srgb,var(--gold) 40%,transparent)}
.res-gems .res-v{color:var(--gem);text-shadow:0 0 12px color-mix(in srgb,var(--gem) 38%,transparent)}
.res-energy .res-v{color:var(--steel);text-shadow:0 0 12px color-mix(in srgb,var(--steel) 38%,transparent)}
.hud-lvl{min-width:82px}
.lvl-row{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--fg-muted);font-weight:600}
.lvl-row .gps{color:var(--ember-hot)}
.xpbar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--surface-3) 80%,#000);overflow:hidden;margin-top:3px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.55)}
.xpbar i{display:block;height:100%;background:var(--grad-ember);border-radius:3px;
  box-shadow:0 0 10px color-mix(in srgb,var(--ember) 55%,transparent);transition:width .35s var(--ease-out)}
.hud-gear{width:36px;height:36px;border-radius:50%;cursor:pointer;
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface-3) 55%,transparent),color-mix(in srgb,var(--surface-2) 72%,transparent));
  border:1px solid color-mix(in srgb,var(--line-strong) 55%,transparent);box-shadow:var(--hi);
  transition:transform .25s var(--ease-spring)}
.hud-gear:hover{transform:rotate(24deg)}
.hud-gear:active{transform:scale(.92)}

/* ---------- stage ---------- */
.stage{
  flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
  scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent;
}
.stage::-webkit-scrollbar{width:5px}
.stage::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.screen{padding:16px 13px 26px;display:flex;flex-direction:column;gap:14px}
.screen-h{font-size:21px;font-weight:700}
.screen-sub{margin:-8px 0 0;color:var(--fg-muted);font-size:13px}

/* ---------- tab bar (thumb zone) ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(0deg,var(--glass),color-mix(in srgb,var(--surface-1) 62%,transparent));
  backdrop-filter:blur(16px) saturate(1.3); -webkit-backdrop-filter:blur(16px) saturate(1.3);
  border-top:1px solid color-mix(in srgb,var(--line) 80%,transparent);
  box-shadow:0 -10px 30px rgba(0,0,0,.35),var(--hi);
}
.tabbar::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ember) 45%,transparent),transparent);opacity:.45}
.tab{
  position:relative;min-height:var(--nav-h);background:none;border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg-dim);
  transition:color .18s;
}
.tab::before{content:"";position:absolute;top:5px;width:44px;height:30px;border-radius:999px;
  background:color-mix(in srgb,var(--ember) 16%,transparent);opacity:0;transform:scale(.7);
  transition:opacity .2s,transform .25s var(--ease-spring)}
.tab-icon{font-size:19px;line-height:1;filter:grayscale(1) opacity(.6);transition:filter .18s,transform .22s var(--ease-spring);position:relative}
.tab-label{font-size:10.5px;font-weight:600;letter-spacing:.02em;position:relative}
.tab.on{color:var(--ember-hot)}
.tab.on::before{opacity:1;transform:scale(1)}
.tab.on .tab-icon{filter:none;transform:translateY(-1px) scale(1.1);text-shadow:0 0 14px color-mix(in srgb,var(--ember) 60%,transparent)}
.tab:active .tab-icon{transform:scale(.92)}
.tab-dot{position:absolute;top:8px;right:calc(50% - 21px);width:8px;height:8px;border-radius:50%;
  background:var(--ok);box-shadow:0 0 0 2px var(--surface-1),0 0 10px var(--ok);animation:pulseDot 1.8s ease-in-out infinite}
@keyframes pulseDot{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

/* ---------- buttons ---------- */
.btn{
  position:relative;overflow:hidden;
  min-height:var(--tap);padding:11px 16px;border-radius:var(--r-md);border:1px solid transparent;
  font-weight:700;font-size:14.5px;cursor:pointer;background:var(--surface-2);color:var(--fg);
  transition:transform .1s var(--ease-out),filter .15s,box-shadow .2s,background .15s;touch-action:manipulation;
}
.btn:active{transform:scale(.965)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{min-height:38px;padding:7px 12px;font-size:13px;border-radius:var(--r-sm)}
.btn-block{width:100%;display:block}
.btn-primary{
  background:var(--grad-ember);color:var(--fg-inverse);border-color:transparent;
  box-shadow:0 4px 18px color-mix(in srgb,var(--ember) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.18);
  text-shadow:0 1px 0 rgba(255,255,255,.18);
}
.btn-primary::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);
  transform:translateX(-120%);transition:transform .55s var(--ease-out)}
.btn-primary:not(:disabled):hover{filter:brightness(1.08) saturate(1.05);
  box-shadow:0 6px 26px color-mix(in srgb,var(--ember) 52%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-primary:not(:disabled):hover::after{transform:translateX(120%)}
.btn-ghost{background:linear-gradient(180deg,color-mix(in srgb,var(--surface-3) 45%,transparent),var(--surface-2));
  border-color:color-mix(in srgb,var(--line-strong) 60%,transparent);color:var(--fg);box-shadow:var(--hi)}
.btn-ghost:not(:disabled):hover{border-color:var(--ember);color:var(--ember-hot)}
.btn-danger{background:linear-gradient(160deg,#991B1B,#7F1D1D);color:#FEE2E2;border-color:#B91C1C;
  box-shadow:0 4px 16px rgba(185,28,28,.3),inset 0 1px 0 rgba(255,255,255,.15)}
:focus-visible{outline:2px solid var(--ember-hot);outline-offset:2px}

/* ---------- panels ---------- */
.panel{background:var(--grad-panel);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);
  border-radius:var(--r-lg);padding:15px;box-shadow:var(--shadow-1),var(--hi)}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:10px}
.panel-h.row{align-items:center}
.panel-hint{font-size:11.5px;color:var(--fg-dim);font-weight:500}

/* ---------- forge ---------- */
.screen-forge{gap:12px}
.forge-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 2px}
.forge-stat{display:flex;flex-direction:column}
.forge-stat.right{text-align:right;align-items:flex-end}
.forge-stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--fg-dim)}
.forge-stat .big{font-family:var(--font-display);font-size:32px;font-weight:800;line-height:1.05;color:var(--fg);
  text-shadow:0 0 26px color-mix(in srgb,var(--ember) 30%,transparent)}
.forge-stat .big.ember{background:var(--grad-ember);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ember) 34%,transparent))}
.forge-stat .sub{font-size:11.5px;color:var(--fg-muted)}

.forge-stage{position:relative;display:grid;place-items:center;min-height:38vh;padding:8px 0 4px}
.forge-glow{position:absolute;width:min(80vw,360px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--ember) 34%,transparent),color-mix(in srgb,var(--ember) 8%,transparent) 45%,transparent 70%);
  filter:blur(8px);animation:breathe 3.4s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.1);opacity:1}}
.forge-btn{
  position:relative;width:min(54vw,222px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;
  background:
    radial-gradient(circle at 50% 30%,rgba(255,214,140,.16),transparent 46%),
    radial-gradient(circle at 50% 36%,#43301D,#241A12 55%,#150F0B 78%);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ember-hot) 38%,transparent),
             inset 0 0 0 9px rgba(0,0,0,.28),
             inset 0 -18px 38px rgba(0,0,0,.65),
             inset 0 14px 26px rgba(255,176,32,.14),
             0 14px 40px rgba(0,0,0,.55), 0 0 54px color-mix(in srgb,var(--ember) 26%,transparent);
  display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  transition:transform .07s ease-out,box-shadow .25s;
}
.forge-btn:hover{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ember-hot) 55%,transparent),
  inset 0 0 0 9px rgba(0,0,0,.28),inset 0 -18px 38px rgba(0,0,0,.65),inset 0 14px 26px rgba(255,176,32,.2),
  0 14px 44px rgba(0,0,0,.55),0 0 74px color-mix(in srgb,var(--ember) 40%,transparent)}
.forge-btn.down{transform:scale(.95)}
.forge-anvil{font-size:min(21vw,90px);filter:drop-shadow(0 6px 16px color-mix(in srgb,var(--ember) 55%,transparent)) drop-shadow(0 2px 4px rgba(0,0,0,.6));pointer-events:none}
.forge-ring{position:absolute;inset:-7px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 210deg,transparent 0 38%,color-mix(in srgb,var(--ember-hot) 65%,transparent) 50%,transparent 62% 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  animation:ringSpin 7s linear infinite;opacity:.8}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.forge-btn.down .forge-ring{animation:ring .35s ease-out}
@keyframes ring{from{transform:scale(1);opacity:.95}to{transform:scale(1.24);opacity:0}}

.combo-wrap{position:absolute;bottom:26px;display:flex;align-items:center;gap:8px;
  background:color-mix(in srgb,var(--bg-void) 72%,transparent);backdrop-filter:blur(8px);
  border:1px solid color-mix(in srgb,var(--ember) 38%,var(--line));border-radius:999px;padding:4px 13px;
  box-shadow:0 4px 18px rgba(0,0,0,.5),0 0 16px color-mix(in srgb,var(--ember) 18%,transparent)}
.combo-x{font-family:var(--font-display);font-weight:800;color:var(--ember-hot);font-size:15px;
  text-shadow:0 0 12px color-mix(in srgb,var(--ember) 55%,transparent)}
.combo-bar{display:block;width:74px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.combo-bar i{display:block;height:100%;background:var(--grad-ember);box-shadow:0 0 8px color-mix(in srgb,var(--ember) 60%,transparent)}
.click-hint{position:absolute;bottom:2px;font-size:11.5px;color:var(--fg-dim);letter-spacing:.04em}

.golden{
  position:absolute;width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;font-size:31px;
  background:radial-gradient(circle,#FFF3C4,#FFC53D 55%,color-mix(in srgb,var(--gold) 0%,transparent));
  box-shadow:0 0 34px color-mix(in srgb,var(--gold) 80%,transparent),0 0 80px color-mix(in srgb,var(--gold) 35%,transparent);
  animation:float 2.6s ease-in-out infinite;z-index:5;touch-action:manipulation;
}
.golden.fade{opacity:0;transform:scale(.5);transition:opacity .5s,transform .5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(5deg)}}

/* ---------- claim strip ---------- */
.claim-strip{display:grid;gap:8px}
.claim-card{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;width:100%;
  min-height:var(--tap);padding:10px 13px;border-radius:var(--r-md);cursor:pointer;text-align:left;
  background:linear-gradient(100deg,color-mix(in srgb,var(--ok) 9%,var(--surface-2)),var(--surface-1));
  border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line));color:var(--fg);
  box-shadow:var(--hi),0 3px 14px rgba(0,0,0,.3);
  transition:transform .12s var(--ease-out),box-shadow .2s;
}
.claim-card.ready,.claim-card{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.claim-card:hover{transform:translateY(-1px);box-shadow:var(--hi),0 6px 20px rgba(0,0,0,.38),0 0 18px color-mix(in srgb,var(--ok) 18%,transparent)}
.claim-card:active{transform:scale(.99)}
.cc-ic{font-size:23px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.cc-body{display:flex;flex-direction:column;min-width:0}
.cc-body b{font-size:14px}
.cc-body small{font-size:11.5px;color:var(--fg-muted)}
.cc-cta{font-weight:800;font-size:12.5px;color:var(--ok);text-transform:uppercase;letter-spacing:.06em;
  text-shadow:0 0 12px color-mix(in srgb,var(--ok) 45%,transparent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--surface-3);margin-left:3px}
.dot.on{background:var(--ember-hot);box-shadow:0 0 7px color-mix(in srgb,var(--ember-hot) 70%,transparent)}
.dot.big{width:9px;height:9px}
.dot.big.on{background:var(--gold);box-shadow:0 0 9px color-mix(in srgb,var(--gold) 70%,transparent)}

/* ---------- quests ---------- */
.quest-list{display:grid;gap:9px}
.quest{background:linear-gradient(165deg,color-mix(in srgb,var(--surface-3) 38%,transparent),var(--surface-2));
  border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:var(--r-md);padding:10px 12px;
  box-shadow:var(--hi);transition:border-color .2s,box-shadow .2s}
.quest.ready{border-color:color-mix(in srgb,var(--ok) 58%,var(--line));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 22%,transparent),0 0 20px color-mix(in srgb,var(--ok) 12%,transparent),var(--hi)}
.quest.claimed{opacity:.55}
.q-main{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.q-name{font-weight:700;font-size:14px}
.q-prog{font-size:12px;color:var(--fg-muted);font-variant-numeric:tabular-nums}
.q-bar{height:7px;border-radius:4px;background:color-mix(in srgb,var(--surface-3) 78%,#000);overflow:hidden;margin:8px 0;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.55)}
.q-bar i{display:block;height:100%;background:var(--grad-ember);border-radius:4px;
  box-shadow:0 0 10px color-mix(in srgb,var(--ember) 45%,transparent);transition:width .45s var(--ease-out)}
.quest.ready .q-bar i{background:linear-gradient(90deg,#4ADE80,#22C55E);box-shadow:0 0 12px rgba(74,222,128,.5)}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.q-reward{font-size:12.5px;color:var(--fg-muted)}
.q-done{font-size:12.5px;color:var(--ok);font-weight:700}

/* ---------- generators ---------- */
.qty-switch{display:flex;gap:4px;background:color-mix(in srgb,var(--surface-2) 85%,#000);padding:3px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--line) 85%,transparent);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.qty-switch button{min-height:30px;padding:0 11px;border:0;border-radius:999px;background:none;cursor:pointer;
  font-size:12px;font-weight:700;color:var(--fg-dim);transition:all .18s}
.qty-switch button.on{background:var(--grad-ember);color:var(--fg-inverse);
  box-shadow:0 2px 10px color-mix(in srgb,var(--ember) 45%,transparent)}
.gen-list{display:grid;gap:8px}
.gen{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  background:linear-gradient(165deg,color-mix(in srgb,var(--surface-3) 34%,transparent),var(--surface-2));
  border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:var(--r-md);padding:9px 11px;
  box-shadow:var(--hi),0 2px 10px rgba(0,0,0,.24);
  transition:border-color .2s,opacity .2s,transform .15s var(--ease-out),box-shadow .2s;
}
.gen.can{border-color:color-mix(in srgb,var(--ember) 42%,var(--line))}
.gen.can:hover{transform:translateY(-1px);box-shadow:var(--hi),0 6px 18px rgba(0,0,0,.32),0 0 16px color-mix(in srgb,var(--ember) 12%,transparent)}
.gen.cant{opacity:.72}
.gen.locked{opacity:.5;border-style:dashed}
.gen-ic{font-size:25px;width:36px;text-align:center;filter:saturate(1.08) drop-shadow(0 2px 5px rgba(0,0,0,.5))}
.gen-body{display:flex;flex-direction:column;min-width:0}
.gen-body b{font-size:13.5px;display:flex;align-items:baseline;gap:6px}
.gen-lv{font-style:normal;font-size:11.5px;color:var(--ember-hot);font-weight:700}
.gen-body small{font-size:11.5px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gen-buy{
  min-height:47px;min-width:98px;padding:6px 11px;border-radius:var(--r-sm);cursor:pointer;position:relative;overflow:hidden;
  background:var(--grad-ember);color:var(--fg-inverse);border:0;display:flex;flex-direction:column;
  align-items:flex-end;justify-content:center;gap:1px;touch-action:manipulation;
  box-shadow:0 3px 14px color-mix(in srgb,var(--ember) 36%,transparent),inset 0 1px 0 rgba(255,255,255,.32);
  transition:transform .09s var(--ease-out),filter .15s;
}
.gen-buy:hover{filter:brightness(1.08)}
.gen-buy:active{transform:scale(.95)}
.gen-buy.disabled{background:var(--surface-3);color:var(--fg-dim);cursor:not-allowed;box-shadow:none}
.gb-qty{font-size:10.5px;font-weight:800;letter-spacing:.05em;opacity:.85}
.gb-cost{font-family:var(--font-display);font-weight:800;font-size:13.5px}

/* ---------- prestige ---------- */
.prestige{display:flex;flex-direction:column;gap:8px}
.prestige.ready{background:
  radial-gradient(ellipse 90% 120% at 50% -30%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 65%),
  linear-gradient(130deg,color-mix(in srgb,var(--gold) 8%,transparent),transparent);
  border-radius:var(--r-md);padding:12px;margin:-2px;border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);
  box-shadow:0 0 26px color-mix(in srgb,var(--gold) 12%,transparent),var(--hi)}
.p-lead{font-size:13.5px;color:var(--fg-muted);margin:0}
.p-lead b{color:var(--fg)}
.p-lead .ember,.ember{color:var(--ember-hot)}
.p-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.p-keep{margin:2px 0 0;color:var(--fg-dim)}

/* ---------- skills ---------- */
.skill-list{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;
  background:var(--grad-panel);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);
  border-radius:var(--r-md);padding:11px 12px;box-shadow:var(--hi);transition:border-color .2s,transform .15s var(--ease-out)}
.skill.can{border-color:color-mix(in srgb,var(--ember) 42%,var(--line))}
.skill.can:hover{transform:translateY(-1px)}
.skill.maxed{border-color:color-mix(in srgb,var(--gold) 42%,var(--line));
  box-shadow:0 0 18px color-mix(in srgb,var(--gold) 10%,transparent),var(--hi)}
.skill.cant{opacity:.78}
.sk-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.sk-body b{font-size:14px;display:flex;gap:7px;align-items:baseline}
.sk-body em{font-style:normal;font-size:11.5px;color:var(--ember-hot);font-weight:700}
.sk-body small{font-size:12px;color:var(--fg-muted)}
.sk-body .nxt{color:var(--ok)}
.sk-pips{display:flex;gap:2.5px;margin-top:6px;flex-wrap:wrap}
.sk-pips i{width:8px;height:8px;border-radius:2.5px;background:var(--surface-3);box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.sk-pips i.on{background:var(--grad-ember);box-shadow:0 0 7px color-mix(in srgb,var(--ember) 55%,transparent)}

/* ---------- shop ---------- */
.seg{display:flex;gap:4px;background:color-mix(in srgb,var(--surface-1) 88%,#000);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);
  border-radius:999px;padding:4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.seg button{flex:1;min-height:38px;border:0;border-radius:999px;background:none;cursor:pointer;
  font-size:12.5px;font-weight:700;color:var(--fg-dim);transition:all .18s}
.seg button.on{background:var(--grad-ember);color:var(--fg-inverse);
  box-shadow:0 2px 12px color-mix(in srgb,var(--ember) 45%,transparent)}
.shop-group{margin-top:16px}
.group-h{font-size:14px;text-transform:capitalize;color:var(--fg-muted);margin-bottom:8px;display:flex;gap:7px;align-items:center}
.shop-grid,.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.item-card{
  display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;cursor:pointer;
  background:var(--grad-panel);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);
  border-radius:var(--r-md);padding:12px 8px;min-height:134px;
  box-shadow:var(--hi),0 2px 10px rgba(0,0,0,.24);
  transition:transform .16s var(--ease-out),border-color .2s,box-shadow .25s;
}
.item-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ember) 38%,var(--line));
  box-shadow:var(--hi),0 10px 24px rgba(0,0,0,.38)}
.item-card:active{transform:scale(.975)}
.item-card.owned{opacity:.62}
.item-card.cant .price{color:var(--bad)}
.item-art{width:58px;height:58px;border-radius:var(--r-md);display:grid;place-items:center;font-size:27px;
  background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--surface-3) 85%,transparent),var(--surface-2));
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,244,220,.06),0 3px 10px rgba(0,0,0,.3)}
.item-body{display:flex;flex-direction:column;gap:3px;width:100%}
.item-name{font-size:12.5px;font-weight:700;line-height:1.3}
.item-meta{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--fg-dim)}
.item-meta .rarity{letter-spacing:.02em}
.price{font-weight:800;font-family:var(--font-display)}
.price.ok{color:var(--ok)} .price.no{color:var(--bad)}
.owned-tag{color:var(--ok);font-weight:700}
.r-common .item-art{border-color:var(--r-common)}
.r-uncommon .item-art{border-color:var(--r-uncommon);box-shadow:0 0 10px color-mix(in srgb,var(--r-uncommon) 22%,transparent)}
.r-rare .item-art{border-color:var(--r-rare);box-shadow:0 0 14px color-mix(in srgb,var(--r-rare) 30%,transparent)}
.r-epic .item-art{border-color:var(--r-epic);box-shadow:0 0 16px color-mix(in srgb,var(--r-epic) 38%,transparent)}
.r-legendary .item-art{border-color:var(--r-legendary);animation:legendaryPulse 2.6s ease-in-out infinite}
.r-limited .item-art{border-color:var(--r-limited);animation:limitedPulse 2.6s ease-in-out infinite}
@keyframes legendaryPulse{0%,100%{box-shadow:0 0 14px color-mix(in srgb,var(--r-legendary) 34%,transparent)}50%{box-shadow:0 0 30px color-mix(in srgb,var(--r-legendary) 62%,transparent)}}
@keyframes limitedPulse{0%,100%{box-shadow:0 0 14px color-mix(in srgb,var(--r-limited) 32%,transparent)}50%{box-shadow:0 0 30px color-mix(in srgb,var(--r-limited) 58%,transparent)}}
.r-common-text{color:var(--r-common)} .r-uncommon-text{color:var(--r-uncommon)}
.r-rare-text{color:var(--r-rare)} .r-epic-text{color:var(--r-epic)}
.r-legendary-text{color:var(--r-legendary)} .r-limited-text{color:var(--r-limited)}

.inv-item{display:flex;flex-direction:column;gap:6px}
.inv-item .item-card{min-height:auto;flex:1}
.inv-actions{display:flex;gap:5px}
.inv-actions .btn{flex:1;min-height:36px}
.collection-bar{margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--fg-muted)}

.crate-card{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--grad-panel);
  border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:var(--r-lg);padding:15px;margin-bottom:10px;
  box-shadow:var(--shadow-1),var(--hi)}
.crate-art{width:66px;height:66px;border-radius:var(--r-md);display:grid;place-items:center;font-size:33px;
  background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--gold) 24%,transparent),var(--surface-2));
  border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line));
  box-shadow:0 0 22px color-mix(in srgb,var(--gold) 16%,transparent),var(--hi);
  animation:bob 3s ease-in-out infinite}
.crate-body h3{font-size:15px;margin-bottom:4px}
.crate-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.crate-actions .btn{flex:1;min-width:120px}

.notice{background:linear-gradient(165deg,color-mix(in srgb,var(--steel) 6%,transparent),var(--surface-1));
  border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-left:3px solid var(--steel);
  border-radius:var(--r-md);padding:12px 14px;font-size:12.5px;color:var(--fg-muted);margin-top:12px;box-shadow:var(--hi)}
.notice b{color:var(--fg)}
.warn-inline{color:var(--warn)}

.pack-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.pack{position:relative;background:var(--grad-panel);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);
  border-radius:var(--r-lg);padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;
  box-shadow:var(--shadow-1),var(--hi);transition:transform .16s var(--ease-out),box-shadow .25s}
.pack:hover{transform:translateY(-3px);box-shadow:var(--shadow-2),var(--hi)}
.pack.featured{border-color:var(--ember);
  background:radial-gradient(ellipse 100% 70% at 50% -10%,color-mix(in srgb,var(--ember) 16%,transparent),transparent 70%),var(--grad-panel);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ember) 30%,transparent),0 10px 30px color-mix(in srgb,var(--ember) 16%,transparent),var(--hi)}
.pack-flag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--grad-ember);
  color:var(--fg-inverse);font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;white-space:nowrap;
  box-shadow:0 3px 12px color-mix(in srgb,var(--ember) 50%,transparent)}
.pack-gems{font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--gem);
  text-shadow:0 0 18px color-mix(in srgb,var(--gem) 42%,transparent)}
.pack-bonus{font-size:11.5px;color:var(--ok);font-weight:700}
.pack-usd{font-size:13px;color:var(--fg-muted);margin-bottom:7px}
.free-gems{margin-top:14px;background:var(--grad-panel);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);
  border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--hi)}
.free-gems h4{font-size:14px;margin-bottom:4px}

/* ---------- ranks ---------- */
.lb{display:flex;flex-direction:column;gap:6px}
.lb-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  background:var(--grad-panel);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);
  border-radius:var(--r-md);padding:9px 12px;box-shadow:var(--hi);
  transition:transform .14s var(--ease-out),border-color .2s}
.lb-row:hover{transform:translateX(2px);border-color:color-mix(in srgb,var(--line-strong) 90%,transparent)}
.lb-row.me{border-color:var(--ember);
  background:linear-gradient(100deg,color-mix(in srgb,var(--ember) 14%,transparent),var(--surface-1));
  box-shadow:0 0 20px color-mix(in srgb,var(--ember) 14%,transparent),var(--hi)}
.lb-rank{font-family:var(--font-display);font-weight:800;font-size:14px;width:34px;text-align:center;color:var(--fg-muted)}
.lb-id{display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;padding:0;text-align:left;min-width:0}
.lb-name{display:flex;flex-direction:column;font-weight:700;font-size:13.5px;min-width:0}
.lb-sub{font-size:11.5px;color:var(--fg-dim);font-weight:500}
.lb-score{font-family:var(--font-display);font-weight:800;font-size:13px;color:var(--gold);white-space:nowrap;
  text-shadow:0 0 12px color-mix(in srgb,var(--gold) 30%,transparent)}
.ach-list{display:flex;flex-direction:column;gap:6px}
.ach{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  background:var(--grad-panel);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);
  border-radius:var(--r-md);padding:9px 12px;box-shadow:var(--hi)}
.ach.on{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));
  box-shadow:0 0 16px color-mix(in srgb,var(--gold) 10%,transparent),var(--hi)}
.ach:not(.on){opacity:.62}
.ach-ic{font-size:20px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))}
.ach-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.ach-body b{font-size:13.5px}
.ach-body small{font-size:11.5px;color:var(--fg-muted)}
.ach-body .q-bar{margin:2px 0 0}
.ach-prog{font-size:11.5px;color:var(--fg-dim);white-space:nowrap}

/* ---------- profile / me ---------- */
.avatar{position:relative;display:inline-grid;place-items:center;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 50% 30%,var(--surface-3),var(--surface-2));
  border:1px solid color-mix(in srgb,var(--line-strong) 65%,transparent);overflow:visible;
  box-shadow:var(--hi),0 3px 10px rgba(0,0,0,.35)}
.avatar-glyph{line-height:1;z-index:2}
.avatar-ring{position:absolute;inset:-3px;border-radius:50%;pointer-events:none}
.avatar-pet{position:absolute;bottom:-5px;right:-7px;font-size:.5em;z-index:3;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.title-pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;
  border-radius:999px;padding:1.5px 8px;margin-left:5px;vertical-align:middle;white-space:nowrap}
.badge-chip{font-size:12px;margin-left:3px}
.signature{font-size:12.5px;color:var(--fg-muted);font-style:italic;margin:5px 0 0}

.me-hero{background:
  radial-gradient(ellipse 110% 90% at 50% -34%,color-mix(in srgb,var(--ember) 22%,transparent),transparent 62%),
  linear-gradient(165deg,var(--surface-2),var(--surface-1));
  border:1px solid color-mix(in srgb,var(--line-strong) 55%,transparent);
  border-radius:var(--r-xl);padding:22px 14px 18px;text-align:center;position:relative;overflow:hidden;
  box-shadow:var(--shadow-2),var(--hi)}
.me-hero::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% -20%,color-mix(in srgb,var(--ember) 18%,transparent),transparent 62%);pointer-events:none}
.me-avatar{display:grid;place-items:center;margin-bottom:9px;position:relative}
.me-name{font-size:23px;position:relative}
.me-titles{min-height:20px;margin:3px 0 10px;position:relative}
.me-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:relative}
.me-stats>div{background:color-mix(in srgb,var(--bg-void) 32%,transparent);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);
  border-radius:var(--r-sm);padding:8px 3px;display:flex;flex-direction:column;box-shadow:var(--hi)}
.me-stats b{font-family:var(--font-display);font-size:15px;color:var(--ember-hot)}
.me-stats small{font-size:10px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.06em}
.me-actions{display:flex;gap:7px;justify-content:center;margin-top:12px;position:relative}

.slots{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.slot-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  background:linear-gradient(165deg,color-mix(in srgb,var(--surface-3) 34%,transparent),var(--surface-2));
  border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:var(--r-md);
  padding:9px 11px;min-height:var(--tap);box-shadow:var(--hi)}
.slot-ic{font-size:20px;width:27px;text-align:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.slot-body{display:flex;flex-direction:column;min-width:0}
.slot-body b{font-size:13px;text-transform:capitalize}
.slot-body small{font-size:11.5px;color:var(--fg-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-ctl{display:flex;align-items:center;justify-content:flex-end;flex:0 0 auto}
.sel{min-height:37px;background:var(--surface-3);border:1px solid color-mix(in srgb,var(--line-strong) 60%,transparent);
  border-radius:var(--r-sm);padding:0 8px;font-size:12.5px;max-width:152px;box-shadow:var(--hi)}

.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}

  border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:var(--r-sm);padding:7px 4px;
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:var(--hi)}
.album-cell.no{opacity:.42}
.ac-art{width:39px;height:39px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:20px;

.ac-name{font-size:9.5px;line-height:1.25;color:var(--fg-muted);max-width:100%;overflow:hidden}

/* ---------- public profile ---------- */
.public-wrap{display:grid;place-items:center;height:100%;color:var(--fg-muted)}
.pub-profile{display:flex;flex-direction:column;gap:12px}
.pp-top{display:flex;gap:13px;align-items:center}
.pp-top h3{font-size:20px}
.pp-sub{margin:2px 0 0;min-height:18px}
.pp-sig{font-size:12.5px;color:var(--fg-muted);font-style:italic;margin:4px 0 0}
.pp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pp-stats>div{background:linear-gradient(165deg,color-mix(in srgb,var(--surface-3) 34%,transparent),var(--surface-2));
  border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:var(--r-sm);padding:9px 4px;text-align:center;box-shadow:var(--hi)}
.pp-stats b{display:block;font-family:var(--font-display);font-size:15px;color:var(--ember-hot)}
.pp-stats small{font-size:10px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.05em}

/* ---------- modals ---------- */
#modals{position:fixed;inset:0;z-index:100;pointer-events:none}
.modal-back{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(10,6,3,.55),rgba(4,3,2,.82));
  backdrop-filter:blur(5px) saturate(.9); -webkit-backdrop-filter:blur(5px) saturate(.9);
  opacity:0;transition:opacity .24s;pointer-events:auto}
.modal-back.in{opacity:1}
.modal{
  position:absolute;left:50%;bottom:0;transform:translate(-50%,22px);width:min(100%,560px);
  background:linear-gradient(175deg,color-mix(in srgb,var(--surface-2) 72%,transparent),var(--surface-1) 34%);
  border:1px solid color-mix(in srgb,var(--line-strong) 55%,transparent);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:20px 17px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;
  opacity:0;transition:opacity .22s,transform .3s var(--ease-spring);pointer-events:auto;
  box-shadow:var(--shadow-3),var(--hi);
}
.modal.in{opacity:1;transform:translate(-50%,0)}
@media (min-width:640px){
  .modal{bottom:auto;top:50%;border-radius:var(--r-xl);transform:translate(-50%,-46%) scale(.96)}
  .modal.in{transform:translate(-50%,-50%) scale(1)}
}
.modal-title{font-size:19px;margin-bottom:10px;text-align:center}
.modal-text{font-size:14px;color:var(--fg-muted);text-align:center}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1}

.m-reveal,.m-prestige,.m-offline{border:0;background:transparent;box-shadow:none;text-align:center;max-width:430px}
.reveal{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 0}
.reveal-burst{width:170px;height:170px;border-radius:50%;margin-bottom:-130px;
  background:radial-gradient(circle,color-mix(in srgb,var(--gold) 38%,transparent),transparent 66%);
  animation:breathe 2.4s ease-in-out infinite}
.reveal-art{width:100px;height:100px;border-radius:var(--r-lg);display:grid;place-items:center;font-size:46px;
  background:radial-gradient(circle at 50% 28%,var(--surface-3),var(--surface-2));
  border:2px solid var(--line);box-shadow:var(--shadow-2),var(--hi);
  animation:pop .55s var(--ease-spring)}
@keyframes pop{from{transform:scale(.35) rotate(-9deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.reveal-art.r-legendary{border-color:var(--r-legendary);box-shadow:0 0 44px color-mix(in srgb,var(--r-legendary) 58%,transparent),var(--shadow-2)}
.reveal-art.r-limited{border-color:var(--r-limited);box-shadow:0 0 44px color-mix(in srgb,var(--r-limited) 52%,transparent),var(--shadow-2)}
.reveal-art.r-epic{border-color:var(--r-epic);box-shadow:0 0 34px color-mix(in srgb,var(--r-epic) 48%,transparent),var(--shadow-2)}
.reveal-rarity{font-size:11.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-top:8px}
.reveal-name{font-size:24px;margin:1px 0}
.reveal-note{font-size:13px;color:var(--fg-muted)}
.reveal-note.new{color:var(--ok)}
.m-reveal .modal-actions .btn,.m-prestige .modal-actions .btn,.m-offline .modal-actions .btn{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.m-reveal .btn-primary,.m-prestige .btn-primary,.m-offline .btn-primary{background:var(--grad-ember);color:var(--fg-inverse);border:0}

.prestige-reveal{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 0 4px}
.pr-sparks{font-size:15px;color:var(--gold);font-weight:700;letter-spacing:.08em;
  text-shadow:0 0 18px color-mix(in srgb,var(--gold) 50%,transparent)}
.pr-mult{font-family:var(--font-display);font-size:70px;font-weight:800;line-height:1;
  background:var(--grad-ember);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px color-mix(in srgb,var(--ember) 45%,transparent));
  animation:pop .65s var(--ease-spring)}
.pr-label{text-transform:uppercase;letter-spacing:.24em;font-size:11px;color:var(--fg-muted)}
.pr-note{font-size:13px;color:var(--fg-muted);margin-top:10px}

.offline{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 0;position:relative}
.off-glow{position:absolute;top:-46px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--ember) 30%,transparent),transparent 68%);
  animation:breathe 3s ease-in-out infinite}
.off-hi{font-family:var(--font-display);font-size:26px;font-weight:800;margin:0}
.off-sub{font-size:13px;color:var(--fg-muted);margin:0}
.off-amount{font-family:var(--font-display);font-size:44px;font-weight:800;
  background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px color-mix(in srgb,var(--gold) 42%,transparent));
  margin:6px 0 2px;min-height:54px}
.off-rate{margin:0}

.odds{display:flex;flex-direction:column;gap:8px}
.odds h4{font-size:14px}
.odds-table{width:100%;border-collapse:collapse;font-size:13px}
.odds-table td{padding:6px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.odds-table td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-muted)}
.r-legendary-row td:first-child{color:var(--r-legendary);font-weight:700}
.r-epic-row td:first-child{color:var(--r-epic)}
.r-rare-row td:first-child{color:var(--r-rare)}

.item-detail{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.id-art{width:96px;height:96px;border-radius:var(--r-lg);display:grid;place-items:center;font-size:44px;
  background:radial-gradient(circle at 50% 28%,var(--surface-3),var(--surface-2));
  border:2px solid var(--line);margin-bottom:4px;box-shadow:var(--shadow-2),var(--hi)}
.id-art.r-legendary{border-color:var(--r-legendary);box-shadow:0 0 36px color-mix(in srgb,var(--r-legendary) 44%,transparent),var(--shadow-2)}
.id-art.r-epic{border-color:var(--r-epic);box-shadow:0 0 28px color-mix(in srgb,var(--r-epic) 38%,transparent),var(--shadow-2)}
.id-art.r-rare{border-color:var(--r-rare)}
.item-detail h3{font-size:20px}
.id-rarity{font-size:11.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;margin:0}
.id-note{font-size:13px;color:var(--fg-muted);margin:4px 0}
.id-price{font-size:17px;margin:6px 0 0}
.id-stock{color:var(--warn);margin:2px 0 0}

.settings{display:flex;flex-direction:column;gap:3px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;
  min-height:var(--tap);padding:8px 4px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);cursor:pointer}
.set-row span{display:flex;flex-direction:column;min-width:0}
.set-row b{font-size:14px;font-weight:600}
.set-row small{font-size:11.5px;color:var(--fg-dim)}
.set-row input{width:24px;height:24px;accent-color:var(--ember);flex:0 0 auto}

/* ---------- toasts & floaters ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 68px);
  z-index:120;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:color-mix(in srgb,var(--surface-3) 86%,transparent);backdrop-filter:blur(10px);
  border:1px solid color-mix(in srgb,var(--line-strong) 75%,transparent);color:var(--fg);
  padding:9px 15px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-2),var(--hi);
  opacity:0;transform:translateY(-9px) scale(.95);transition:opacity .2s,transform .28s var(--ease-spring);max-width:100%;text-align:center}
.toast.in{opacity:1;transform:none}
.toast.t-ok{border-color:color-mix(in srgb,var(--ok) 58%,var(--line));color:var(--ok);box-shadow:var(--shadow-2),0 0 18px color-mix(in srgb,var(--ok) 18%,transparent)}
.toast.t-err{border-color:color-mix(in srgb,var(--bad) 58%,var(--line));color:var(--bad)}
.toast.t-gold{border-color:color-mix(in srgb,var(--gold) 58%,var(--line));color:var(--gold);
  box-shadow:var(--shadow-2),0 0 18px color-mix(in srgb,var(--gold) 20%,transparent)}

.floater{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-display);font-weight:800;
  font-size:17px;color:var(--gold);text-shadow:0 2px 4px rgba(0,0,0,.8),0 0 16px color-mix(in srgb,var(--gold) 45%,transparent);
  pointer-events:none;animation:fly 1s cubic-bezier(.2,.7,.3,1) forwards;white-space:nowrap}
.floater.f-crit{font-size:27px;color:var(--ember-hot);text-shadow:0 2px 4px rgba(0,0,0,.8),0 0 22px color-mix(in srgb,var(--ember) 65%,transparent)}
.floater.f-gem{font-size:20px;color:var(--gem);text-shadow:0 2px 4px rgba(0,0,0,.8),0 0 18px color-mix(in srgb,var(--gem) 50%,transparent)}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}
  18%{opacity:1;transform:translate(-50%,-70%) scale(1.14)}
  100%{opacity:0;transform:translate(-50%,-195%) scale(.95)}}

/* ---------- auth ---------- */
.auth-wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:28px 18px;position:relative;
  background:
    radial-gradient(ellipse 90% 46% at 50% -6%,color-mix(in srgb,var(--ember) 18%,transparent),transparent 62%),
    radial-gradient(ellipse 70% 40% at 50% 112%,color-mix(in srgb,var(--ember-deep) 12%,transparent),transparent 65%),
    var(--bg-base)}
.auth-brand{text-align:center}
.auth-brand .logo{width:80px;height:80px;margin:0 auto 10px;
  filter:drop-shadow(0 0 30px color-mix(in srgb,var(--ember) 55%,transparent));animation:bob 3.2s ease-in-out infinite}
.wordmark{font-family:var(--font-display);font-size:32px;font-weight:800;letter-spacing:.13em;margin:0;
  text-shadow:0 0 34px color-mix(in srgb,var(--ember) 25%,transparent)}
.wordmark span{display:block;font-weight:300;font-size:20px;letter-spacing:.4em;
  background:var(--grad-ember);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--fg-muted);font-size:13.5px;margin-top:8px}
.auth-card{width:min(100%,384px);background:linear-gradient(175deg,color-mix(in srgb,var(--surface-2) 66%,transparent),var(--surface-1) 36%);
  border:1px solid color-mix(in srgb,var(--line-strong) 55%,transparent);
  border-radius:var(--r-xl);padding:22px 19px;box-shadow:var(--shadow-3),var(--hi);
  backdrop-filter:blur(6px)}
.auth-card h2{font-size:19px;margin-bottom:12px;text-align:center}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field span{font-size:12.5px;color:var(--fg-muted);font-weight:600}
.field input{min-height:var(--tap);padding:11px 13px;border-radius:var(--r-md);
  background:color-mix(in srgb,var(--surface-2) 88%,#000);
  border:1px solid color-mix(in srgb,var(--line) 90%,transparent);font-size:16px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.4);transition:border-color .18s,box-shadow .18s}  /* 16px prevents iOS zoom-on-focus */
.field input:focus{border-color:var(--ember);outline:none;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.4),0 0 0 3px color-mix(in srgb,var(--ember) 22%,transparent),0 0 18px color-mix(in srgb,var(--ember) 14%,transparent)}
.field.inline{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 8px}
.field.inline input{flex:1;min-height:38px;font-size:14px}
.auth-alt{text-align:center;font-size:13px;color:var(--fg-muted);margin-top:12px}
.auth-fine{font-size:11.5px;color:var(--fg-dim);text-align:center;margin-top:10px;line-height:1.5}
.auth-error{color:var(--bad);font-size:13px;text-align:center;min-height:18px;margin-top:6px}
#guestBtn{margin-top:12px}

.fatal{padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

/* ---------- animations used by cosmetic css descriptors ---------- */
@keyframes fi-pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.28)}}
@keyframes fi-shimmer{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.22) saturate(1.25)}}
@keyframes fi-hue{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
@keyframes fi-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes fi-bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(3deg)}}

.pulse{animation:pulseOnce .38s var(--ease-out)}
@keyframes pulseOnce{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.nope{animation:nope .3s ease-in-out}
@keyframes nope{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* ---------- calm mode: strip the pressure, keep the game ---------- */
body.calm .golden,body.calm .combo-wrap,body.calm .claim-strip,body.calm .crate-card,
body.calm .pack-flag,body.calm .id-stock{display:none !important}
body.calm .forge-glow{animation:none}
body.calm .tab-dot{display:none}
body.calm .forge-ring{animation:none}
body.calm::before{animation:none}

/* ---------- accessibility ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
  .golden{animation:none}
  .forge-glow{animation:none}
  body::before{animation:none}
}
@media (prefers-contrast: more){
  :root{--line:#6B6259;--line-strong:#8C8279;--fg:#FFFFFF;--fg-muted:#DED6CA}
}

/* ---------- desktop ---------- */
@media (min-width:900px){
  .screen{padding:22px 24px 32px}
  .forge-stage{min-height:42vh}
  .gen-list{grid-template-columns:1fr 1fr}
  .skill-list{grid-template-columns:1fr 1fr}
  .shop-grid,.inv-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .tabbar{border-radius:0}
  .tab-label{font-size:11.5px}
}

.demo-banner{position:fixed;top:0;left:0;right:0;z-index:300;background:#7C2D12;color:#FFEDD5;
  font:600 11.5px/1.4 system-ui,sans-serif;text-align:center;padding:5px 10px}
#app,#boot{padding-top:26px}

const SUFFIX_A = ['', 'K', 'M', 'B', 'T'];
const LETTERS = 'abcdefghijklmnopqrstuvwxyz';

/** Suffix index → string. 0-4 = K/M/B/T, then aa, ab, ac … az, ba, bb … */
function suffix(i) {

/** Format any number for display. Never emits a raw 18-digit string. */
function fmt(n, decimals = 2) {
  n = Number(n) || 0;
  const neg = n < 0;
  n = Math.abs(n);
  if (n < 1000) {
    const s = n < 10 && n % 1 !== 0 ? n.toFixed(1) : Math.floor(n).toString();
    return (neg ? '-' : '') + s;
  }
  let tier = Math.floor(Math.log10(n) / 3);
  const maxTier = SUFFIX_A.length - 1 + 26 * 26;
  if (tier > maxTier) return (neg ? '-' : '') + n.toExponential(2).replace('+', '');

    if (reward.gems) addCur('gems', reward.gems, 'streak');
    checkAchievements();
    return { ok: true, streak: S.streakDays, reward, day_in_cycle: ((S.streakDays - 1) % 7) + 1 };
  },

  buy(offerId) {
    const o = offers().find(x => x.id === offerId);
    if (!o) return { ok: false, error: 'offer_unavailable' };
    const it = item(o.item);
    if (!it) return { ok: false, error: 'offer_unavailable' };
    if (o.slot !== 'crate' && S.owned[o.item]) return { ok: false, error: 'already_owned' };
    if (!addCur(o.currency, -o.price, 'shop_buy')) return { ok: false, error: 'not_enough' };
    S.owned[o.item] = { qty: (S.owned[o.item]?.qty || 0) + 1, source: o.currency === 'gems' ? 'gems' : 'gold', at: now() };
    bump('buys', 1);
    bump('spent_' + o.currency, o.price);
    grantXp(15);
    checkAchievements();
    return { ok: true, item: o.item, name: it.name, rarity: it.rarity, slot: it.slot,
             tradable: o.currency === 'gems' ? 0 : (it.tradable ?? 1),
             spent: { cur: o.currency, amount: o.price } };
  },

  open_crate(id, free) {
    const c = (cfg().crates || {})[id];
    if (!c) return { ok: false, error: 'unknown_crate' };
    const cooldown = (c.free_cooldown_hours || 0) * 3600;
    if (free) {
      if (!cooldown) return { ok: false, error: 'no_free_crate' };
      if (S.lastFreeCrate + cooldown > now()) return { ok: false, error: 'cooldown', ready_in: S.lastFreeCrate + cooldown - now() };
      S.lastFreeCrate = now();
    } else {
      const have = S.owned[id]?.qty || 0;
      if (have <= 0) return { ok: false, error: 'no_crate' };
      S.owned[id].qty = have - 1;
      if (S.owned[id].qty <= 0) delete S.owned[id];
    }
    const roll = rollCrateLocal(id, Object.keys(S.owned), dropBonus());
    const it = roll.item_id ? item(roll.item_id) : null;
    const odds = crateOddsLocal(id);
    const out = { ok: true, free: !!free, crate: id, roll: roll.roll, total: roll.total, odds };
    if (!it) { out.reward = { type: 'gold', amount: 0 }; return out; }
    if (S.owned[roll.item_id]) {
      const pct = c.dupe_gold_pct ?? 25;
      const val = it.price_gold || (it.price_gems || 0) * 25000;
      const g = Math.max(1000, val * pct / 100);
      addCur('gold', g, 'crate_dupe');
      out.reward = { type: 'dupe', item: it.id, name: it.name, rarity: it.rarity, gold: g };
    } else {
      S.owned[it.id] = { qty: 1, source: free ? 'free_crate' : 'paid_crate', at: now(), tradable: free ? 1 : 0 };
      out.reward = { type: 'item', item: it.id, name: it.name, rarity: it.rarity, slot: it.slot, css: it.css || null, new: true };
    }
    bump('crates', 1);
    grantXp(25);
    checkAchievements();
    return out;
  },

  equip(slot, itemId) {
    if (!(cfg().slots || []).includes(slot)) return { ok: false, error: 'bad_slot' };
    if (itemId) {
      const it = item(itemId);
      if (!it) return { ok: false, error: 'unknown_item' };
      if (it.slot !== slot) return { ok: false, error: 'slot_mismatch' };
      if (!S.owned[itemId]) return { ok: false, error: 'not_owned' };
      S.loadout[slot] = itemId;
    } else delete S.loadout[slot];
    return { ok: true, loadout: { ...S.loadout } };
  },

  prestige(confirm) {
    const c = canPrestige();
    if (!confirm) return { ok: false, error: 'needs_confirm', check: c };
    if (!c.ok) return { ok: false, error: 'not_ready', check: c };
    S.sparks = c.potential;
    S.prestigeCount++;
    if (S.gold) addCur('gold', -S.gold, 'prestige_burn');
    S.runGold = 0; S.xp = 0; S.gens = {}; S.skills = {};
    checkAchievements();
    return { ok: true, sparks: S.sparks, gain: c.gain, mult: c.mult };
  },

  save_settings(patch) {
    S.settings = { ...S.settings, ...(patch || {}) };
    if (typeof S.settings.signature === 'string') S.settings.signature = S.settings.signature.slice(0, 120);
    return { ok: true, settings: { ...S.settings } };
  },
};

/** Demo-only gem grant used by the simulated payment flow. */
function demoGrantGems(n) { return addCur('gems', Math.max(0, n | 0), 'iap_demo'); }

function canPrestige() {
  const p = cfg().prestige || {};
  const pot = sparksFor(S.runGold);
  const gate = p.gate_multiplier ?? 1.75;
  const need = Math.max(p.min_sparks_to_prestige ?? 5, Math.ceil(S.sparks * gate));
  return { potential: pot, current: S.sparks, gain: Math.max(0, pot - S.sparks), required: need,
           ok: pot >= need && pot > S.sparks, mult: 1 + (p.gps_bonus_per_spark ?? 0.02) * pot,
           need_gold: goldForSparks(need), gate };
}

/* ------------------------------------------------------------------ *
 *  Offers (mirrors Shop::offers)
 * ------------------------------------------------------------------ */
function offers() {
  // Rebuilt every call: it is ~30 rows and must never go stale after a reset.
  const list = [];
  let id = 0;
  for (const it of Object.values(cfg().catalog || {})) {
    if (it.css?.achievement) continue;
    const cur = it.price_gems ? 'gems' : it.price_gold ? 'gold' : null;
    if (!cur) continue;
    list.push({ id: ++id, item: it.id, name: it.name, slot: it.slot, rarity: it.rarity, css: it.css || null,
                currency: cur, price: cur === 'gems' ? it.price_gems : it.price_gold,
                stockLeft: it.css?.edition ?? null, endsAt: null, featured: it.rarity === 'legendary' || it.rarity === 'limited' });
  }
  for (const [cid, c] of Object.entries(cfg().crates || {})) {
    if (!c.price_gems) continue;
    list.push({ id: ++id, item: cid, name: c.name, slot: 'crate', rarity: 'rare', css: null,
                currency: 'gems', price: c.price_gems, stockLeft: null, endsAt: null, featured: true });
  }
  list.sort((a, b) => (b.featured - a.featured) || a.price - b.price);
  return list;
}

/* ------------------------------------------------------------------ *
 *  Snapshot (mirrors Game::snapshot)
 * ------------------------------------------------------------------ */
function snapshot(extra = {}) {
  if (!S) loadDemo();
  const idle = settleIdle();
  const d = dayKey();
  const ownedList = Object.entries(S.owned).map(([item_id, o]) => ({ item_id, qty: o.qty || 1, source: o.source, acquired_at: o.at }));
  const catalog = {};
  for (const it of Object.values(cfg().catalog || {})) catalog[it.id] = { name: it.name, slot: it.slot, rarity: it.rarity, css: it.css || null };

  const quests = (cfg().quests_daily || []).map(q => {
    const prog = q.metric === 'gold_earned' ? Math.floor(S.totalGold) : metricValue(q.metric);
    const b = questBonus();
    return { id: q.id, name: q.name, metric: q.metric, target: q.target,
             progress: Math.min(prog, q.target), done: prog >= q.target,
             claimed: !!S.questsClaimed[d + ':' + q.id],
             reward: { gold: Math.floor((q.reward.gold || 0) * b), gems: q.reward.gems || 0, xp: Math.floor((q.reward.xp || 0) * b) } };
  });

  const achievements = (cfg().achievements || []).map(a => ({
    id: a.id, name: a.name, desc: a.desc, target: a.target, tier: a.tier, reward: a.reward,
    progress: Math.min(metricValue(a.metric), a.target), unlocked: S.achievements.includes(a.id),
  }));

  const skills = (cfg().skills || []).map(k => {
    const lvl = skillLv(k.id);
    const maxed = lvl >= k.max;
    const cost = Math.round(skillCost(k, lvl) * (1 - costReduction()));
    return { id: k.id, name: k.name, level: lvl, max: k.max, effect: k.effect, per_level: k.per_level,
             cost: maxed ? null : cost, maxed, affordable: !maxed && S.gold >= cost };
  });

  const gens = (cfg().generators || []).map(g => {
    const lvl = S.gens[g.id] || 0;
    const unlocked = genUnlocked(g.id);
    const cost = genCost(g, lvl, costReduction());
    const m = pMult() * gpsSkillMult();
    return { id: g.id, name: g.name, icon: g.icon || '⚙️', tier: g.tier, level: lvl, unlocked,
             need_prev: g.need_prev_count || 0, cost: Math.round(cost), prod_each: g.base_prod,
             prod_now: genProd(g, lvl) * m, prod_next: genProd(g, lvl + 1) * m,
             affordable: S.gold >= cost };
  });

  const energyCap = 20 + skillLv('stamina');
  S.energy = Math.min(energyCap, S.energy + Math.max(0, now() - S.energyAt) / 600);
  S.energyAt = now();

  return {
    ok: true, serverTime: now(), serverDay: d,
    state: { gold: S.gold, gems: S.gems, tokens: S.tokens, energy: Math.round(S.energy * 100) / 100,
             energyCap, level: S.level, xp: S.xp, xpToNext: xpToNext(S.level), sparks: S.sparks,
             prestigeCount: S.prestigeCount, runGold: S.runGold, totalGold: S.totalGold,
             totalClicks: S.totalClicks, streakDays: S.streakDays,
             streakClaimed: S.lastClaimDay === d, lastFreeCrate: S.lastFreeCrate },
    derived: { gps: gps(), gpsRaw: gpsRaw(), prestigeMult: pMult(), skillMult: gpsSkillMult(),
               clickValue: clickValue(), offlineEff: offlineEff(), offlineCap: offlineCap() },
    prestige: canPrestige(),
    gens, skills, quests, achievements,
    owned: ownedList,
    loadout: { ...S.loadout }, settings: { ...S.settings }, catalog,
    crates: Object.entries(cfg().crates || {}).map(([id, c]) => ({
      id, name: c.name, price_gems: c.price_gems || null, free_cooldown_hours: c.free_cooldown_hours || 0,
      odds: crateOddsLocal(id) })),
    slots: cfg().slots || [],
    packs: cfg().gem_packs || [],
    payProvider: '',
    idle,
    offers: offers(),
    leaderboard: demoLeaderboard(),
    myRank: 1,
    online: 1,
    poll: 10,
    ...extra,
  };
}
